name: Official components end-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - run: python3 emu/tools/official-java-audio.py /tmp/vendor
      - run: python3 emu/tools/pack-official-components.py /tmp/vendor public/x64/official
      - name: Mimic Capacitor decompressed APK assets
        run: |
          python3 - <<'PYCODE'
          import gzip, pathlib
          for p in pathlib.Path('public/x64/official').rglob('*.gz'):
              p.with_suffix('').write_bytes(gzip.decompress(p.read_bytes()))
          PYCODE
      - run: ZIG=zig ./emu/x64/build.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify checksums, real installs and reload
        run: E2E_GREP='official components verify' node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-components-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
