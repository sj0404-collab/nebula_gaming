name: WASM component persistence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - run: sudo apt-get update && sudo apt-get install -y -q cabextract p7zip-full msitools
      - name: Build official runtime packs
        run: |
          ./emu/tools/runtime-pack.sh public/x64/sys32
          DX_REDIST_FILE=/tmp/dx/redist.exe ./emu/tools/dx-pack.sh public/x64/dx /tmp/dx/pack
          DX_REDIST_FILE=/tmp/dx/redist.exe DX_ARCH=x86 ./emu/tools/dx-pack.sh public/x64/dx/x86 /tmp/dx/pack32
          ./emu/tools/dotnet-pack.sh public/x64/dotnet /tmp/dn/pack
      - name: Build WASM emulator
        run: ZIG=zig ./emu/x64/build.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install, reopen, reload and simulate storage failure
        run: E2E_GREP='components persist across' node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: components-persistence-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
