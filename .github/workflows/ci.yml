name: CI (emulator · Android)

on:
  push:
    branches: [main, wip-dotnet]   # wip-dotnet: every WIP push gets the full build + test run on the runner (no local test runs)
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-pack:
    name: Windows runtime pack (VC++ 2015–2022 Redistributable x64 → /x64/sys32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q cabextract
      - name: Download the official vc_redist.x64.exe and extract its x64 DLLs (msvcp140*, vcruntime140*, concrt140, vcomp140, mfc140* …) + manifest
        run: ./emu/tools/runtime-pack.sh public/x64/sys32
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-pack
          path: public/x64/sys32/
          if-no-files-found: error

  dx-pack:
    name: DirectX pack (official DirectX End-User Runtimes June 2010, x64 user-mode DLLs → /x64/dx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q cabextract
      - name: Download directx_Jun2010_redist.exe, extract the x64 cabinets (D3DCompiler_33…43, d3dx9/10/11, d3dcsx, X3DAudio), gzip per file + manifest (nothing modified)
        run: ./emu/tools/dx-pack.sh public/x64/dx /tmp/dx/pack
      - uses: actions/upload-artifact@v4
        with:
          name: dx-pack
          path: public/x64/dx/
          if-no-files-found: error

  dotnet-pack:
    name: .NET pack (official Microsoft .NET 10 runtime win-x64 → /x64/dotnet) + managed test apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the official dotnet-runtime-10.0.x-win-x64.zip, gzip per file + manifest (nothing modified)
        run: ./emu/tools/dotnet-pack.sh public/x64/dotnet /tmp/dn/pack
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build the managed test apps (net10.0 framework-dependent + apphost; classic net48 AnyCPU exe)
        run: |
          dotnet publish emu/tests/dotnet/app -c Release -o /tmp/dn/app
          dotnet build emu/tests/dotnet/fx -c Release -o /tmp/dn/fx
          mkdir -p dn-tests && cp -r /tmp/dn/app /tmp/dn/fx dn-tests/
      - name: Roslyn csc.dll (IL-only, from the official Microsoft.Net.Compilers.Toolset 5.0.0 NuGet package) for the compiler test
        run: |
          curl -fsSL -o /tmp/roslyn.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.net.compilers.toolset/5.0.0/microsoft.net.compilers.toolset.5.0.0.nupkg
          mkdir -p dn-tests/csc && (cd dn-tests/csc && unzip -q -o /tmp/roslyn.nupkg 'tasks/netcore/bincore/*') && ls dn-tests/csc/tasks/netcore/bincore | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-pack
          path: public/x64/dotnet/
          if-no-files-found: error
          include-hidden-files: true   # shared/Microsoft.NETCore.App/<ver>/.version is a dotfile
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-tests
          path: dn-tests/
          if-no-files-found: error

  emulator:
    name: Nebula x64 emulator · native tests + wasm64 build
    runs-on: ubuntu-latest
    needs: [runtime-pack, dotnet-pack, dx-pack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/download-artifact@v4
        with: { name: dx-pack, path: public/x64/dx }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-tests, path: /tmp/dn }
      - name: Unpack the DirectX pack for the native tests (C:\Windows\System32 mount)
        run: mkdir -p /tmp/dx/sys32 && (cd public/x64/dx && for f in *.gz; do gunzip -c "$f" > "/tmp/dx/sys32/${f%.gz}"; done) && ls /tmp/dx/sys32 | wc -l
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - name: Build cmd.exe from source (emu/cmd, zig cc -target x86_64-windows-gnu) + native runner + wasm64 module (zig cc -target wasm64-freestanding)
        run: BUILD_CMD=1 BUILD_PWSH=1 ZIG=zig ./emu/x64/build.sh
      - name: cmd.exe built from source matches the committed emu/cmd/cmd.exe and public/x64/apps/cmd.exe
        run: |
          cmp emu/cmd/cmd.exe public/x64/apps/cmd.exe
          if ! git diff --quiet -- emu/cmd/cmd.exe; then echo "::warning::cmd.exe built in CI differs from the committed one (zig drift?) — CI build is tested"; cp emu/cmd/cmd.exe public/x64/apps/cmd.exe; fi
      - name: Build process-memory regression programs (x86 and x64)
        run: |
          zig cc -target x86_64-windows-gnu -O2 emu/tests/procmem.c -o emu/tests/procmem.exe
          zig cc -target x86-windows-gnu -O2 emu/tests/procmem.c -o emu/tests/procmem32.exe
      - name: Native capability tests (hello, bench, busybox-w32 incl. virtual disk + stdin, plink, NebulaStrike, cmd.exe/system()/subprocess, real msvcp140 via runtime pack, rejections)
        run: DX_PACK=/tmp/dx/sys32 ./emu/tests/run.sh
      - name: .NET tests (REAL CoreCLR 10 + RyuJIT on the emulator — LINQ/exceptions/JSON/reflection/Regex/GC, apphost, GC with spinning + pool threads, HttpClient, direct .dll start, net48 exe, Roslyn csc compiles + runs a program, rejection without the pack)
        run: |
          mkdir -p /tmp/dn/pack && (cd public/x64/dotnet && find . -name '*.gz' -print0 | while IFS= read -r -d '' f; do mkdir -p "/tmp/dn/pack/$(dirname "$f")"; gunzip -c "$f" > "/tmp/dn/pack/${f%.gz}"; done)
          ls -la /tmp/dn/pack /tmp/dn/app | head -20
          ./emu/tests/dotnet.sh /tmp/dn/pack /tmp/dn/app /tmp/dn/fx /tmp/dn/csc/tasks/netcore/bincore
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: .NET on the wasm64 module WITH the x86-64->wasm JIT (node 24 + emu/tests/wasm_run.mjs; the native runner is interpreter-only, JIT bugs only show here and in the browser)
        run: |
          APP=$PWD/public/x64/samples/dotnet
          # wasm_run exits with the guest's exit code (3 = the test's "all passed"), so the pipelines must not fail the step
          node emu/tests/wasm_run.mjs -v --max-ms 900000 --jit 1 --mount "/tmp/dn/pack=C:\Program Files\dotnet" --mount "$APP=C:\app" "$APP/nebula-dotnet-test.exe" linq-throw-nre-json-reflect-regex-gc 2>&1 | tail -40 | tee /tmp/wasm_jit.log || true
          grep -q 'exit 3' /tmp/wasm_jit.log
          node emu/tests/wasm_run.mjs --max-ms 900000 --jit 1 --mount "/tmp/dn/pack=C:\Program Files\dotnet" --mount "$APP=C:\app" "$APP/nebula-dotnet-test.exe" json 2>&1 | tail -5 | tee /tmp/wasm_jit2.log || true
          grep -q 'exit 3' /tmp/wasm_jit2.log
      - name: JIT differential test (emu/tests/jitdiff.c, x64 + x86) — interpreter vs x86->wasm JIT must print identical checksums
        run: |
          set -o pipefail
          zig cc -target x86_64-windows-gnu -O2 -o /tmp/jitdiff.exe emu/tests/jitdiff.c
          zig cc -target x86-windows-gnu -O2 -o /tmp/jitdiff32.exe emu/tests/jitdiff.c
          for exe in /tmp/jitdiff.exe /tmp/jitdiff32.exe; do
            ./emu/x64/x64run --quiet "$exe" | grep -a 'camera\|scalar\|cmp\|packed\|asm\|done' > /tmp/jd_native.txt
            node emu/tests/wasm_run.mjs --max-ms 600000 --jit 0 "$exe" | grep -a 'camera\|scalar\|cmp\|packed\|asm\|done' > /tmp/jd_interp.txt
            node emu/tests/wasm_run.mjs --max-ms 600000 --jit 1 "$exe" | grep -a 'camera\|scalar\|cmp\|packed\|asm\|done' > /tmp/jd_jit.txt
            echo "== $exe"; paste /tmp/jd_native.txt /tmp/jd_interp.txt /tmp/jd_jit.txt
            grep -q 'jitdiff done' /tmp/jd_native.txt
            cmp /tmp/jd_native.txt /tmp/jd_interp.txt
            if ! cmp /tmp/jd_jit.txt /tmp/jd_interp.txt; then
              echo "::error::JIT output differs from the interpreter for $exe — bisecting by instruction kind"
              for r in 48:52 104:115 1:48 100:104; do node emu/tests/wasm_run.mjs --max-ms 600000 --jit 1 --jitskip $r "$exe" | grep -a 'camera\|scalar\|cmp\|packed' > /tmp/jd_skip.txt; if cmp -s /tmp/jd_skip.txt /tmp/jd_interp.txt; then echo "skip $r: MATCH (bug inside kinds $r)"; else echo "skip $r: still differs"; fi; done
              exit 1
            fi
          done
      - name: wasm64 module is bit-identical to the committed public/x64/nebula_x64.wasm
        run: |
          git status --porcelain public/x64/nebula_x64.wasm
          if ! git diff --quiet -- public/x64/nebula_x64.wasm; then echo "::warning::committed wasm differs from CI build (zig version drift?) — CI build is used"; fi
          ls -la public/x64/nebula_x64.wasm
      - name: PE compatibility scan of the bundled samples (report)
        run: |
          for f in public/downloads/NebulaStrike.exe public/x64/samples/*.exe public/x64/apps/*.exe; do echo "== $f"; ./emu/x64/x64run --inspect "$f" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['verdict'], '|', d['why']); print('imports', d['imports'], 'known', d['knownImports'], 'missing', d['unknownImportsCount'])"; done
      - uses: actions/upload-artifact@v4
        with:
          name: nebula_x64-wasm64
          path: public/x64/nebula_x64.wasm

  test:
    needs: emulator
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # Android is the only shipped platform: the e2e run validates the web bundle the APK embeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/download-artifact@v4
        with: { name: dx-pack, path: public/x64/dx }
      - uses: actions/download-artifact@v4   # the wasm64 emulator built in this run — never the committed one (v1.42.0/v1.43.0 APKs shipped a stale module)
        with: { name: nebula_x64-wasm64, path: public/x64 }
      - run: ls -la public/x64/nebula_x64.wasm && sha256sum public/x64/nebula_x64.wasm | tee /tmp/wasm.sha
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Install real opencode (free model opencode/big-pickle, no API key)
        run: bun install -g opencode-ai
      - name: opencode --version
        run: opencode --version

      - name: Bridge integration test (bun test → real agent answer over SSE)
        run: bun test opencode/bridge.test.ts
        timeout-minutes: 8
      - name: Native agent loop (in-app opencode protocol → real Zen model, real shell + files)
        run: bun test opencode/native-agent.test.ts
        timeout-minutes: 5

      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop e2e (33 scenarios incl. .NET 10 (real CoreCLR on the emulator), x64 emulator hello/NebulaStrike/busybox/plink/runtime pack (real msvcp140)/real apps SQLite-jq-Lua-7-Zip-zstd-ripgrep-fd/CPython 3.12/virtual disk + stdin/processes + pipes/SEH + C++ + hardware exceptions, LIVE + NATIVE opencode, WebGL)
        run: node e2e/with-bridge.mjs
        timeout-minutes: 25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e/shots/
          if-no-files-found: ignore

  android:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/download-artifact@v4
        with: { name: dx-pack, path: public/x64/dx }
      - uses: actions/download-artifact@v4   # the wasm64 emulator built in this run — never the committed one (v1.42.0/v1.43.0 APKs shipped a stale module)
        with: { name: nebula_x64-wasm64, path: public/x64 }
      - run: ls -la public/x64/nebula_x64.wasm && sha256sum public/x64/nebula_x64.wasm | tee /tmp/wasm.sha
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with accepted licences; Gradle downloads platform 36 itself
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version from tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.46.0-ci.${GITHUB_RUN_NUMBER}"; fi
          # A UTC timestamp is greater than older semver-based codes and grows across both workflows.
          # Android accepts codes up to 2100000000 (the epoch scheme must be revisited before 2036).
          CODE=$(date -u +%s)
          if (( CODE > 2100000000 )); then echo "Android versionCode exceeds limit" >&2; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/NebulaOS-v${{ steps.v.outputs.name }}-android.apk
          ls -la ../release
      - name: Verify the APK embeds the wasm built in this run
        run: |
          mkdir -p /tmp/apkx && cd /tmp/apkx && unzip -qo "$GITHUB_WORKSPACE"/release/*.apk 2>/dev/null || true
          f=$(find /tmp/apkx -name 'nebula_x64*.wasm' | head -1); [ -n "$f" ] || { echo "no wasm inside the APK"; find /tmp/apkx -maxdepth 3 | head -30; exit 1; }
          echo "APK wasm: $f"; a=$(sha256sum "$f" | cut -d' ' -f1); b=$(cut -d' ' -f1 /tmp/wasm.sha); echo "apk=$a built=$b"; [ "$a" = "$b" ] || { echo "APK wasm differs from the module built in this run"; exit 1; }
      - name: Verify upgrade compatibility with v1.45.0
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous-nebula.apk" https://github.com/sj0404-collab/nebula_gaming/releases/download/v1.45.0/NebulaOS-v1.45.0-android.apk
          old_cert=$($BT/apksigner verify --print-certs "$RUNNER_TEMP/previous-nebula.apk" | grep 'Signer #1 certificate SHA-256 digest:')
          new_cert=$($BT/apksigner verify --print-certs release/*.apk | grep 'Signer #1 certificate SHA-256 digest:')
          test "$old_cert" = "$new_cert" || { echo 'Signing certificate changed; APK cannot update v1.45.0' >&2; exit 1; }
          old=$($BT/aapt dump badging "$RUNNER_TEMP/previous-nebula.apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          new=$($BT/aapt dump badging release/*.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$old" && test -n "$new" && (( new > old )) || { echo "APK versionCode does not upgrade $old -> $new" >&2; exit 1; }
          echo "Verified identical signing certificate and upgrade versionCode $old -> $new"
      - name: Verify APK signature & manifest
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs release/*.apk | head -5
          $BT/aapt dump badging release/*.apk | grep -E "package:|application-label:|sdkVersion|uses-permission" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: NebulaOS-android-apk
          path: release/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true

