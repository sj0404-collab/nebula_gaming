name: CI (emulator · Linux · Windows · macOS · Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-pack:
    name: Windows runtime pack (VC++ 2015–2022 Redistributable x64 → /x64/sys32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q cabextract
      - name: Download the official vc_redist.x64.exe and extract its x64 DLLs (msvcp140*, vcruntime140*, concrt140, vcomp140, mfc140* …) + manifest
        run: ./emu/tools/runtime-pack.sh public/x64/sys32
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-pack
          path: public/x64/sys32/
          if-no-files-found: error

  dotnet-pack:
    name: .NET pack (official Microsoft .NET 10 runtime win-x64 → /x64/dotnet) + managed test apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the official dotnet-runtime-10.0.x-win-x64.zip, gzip per file + manifest (nothing modified)
        run: ./emu/tools/dotnet-pack.sh public/x64/dotnet /tmp/dn/pack
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build the managed test apps (net10.0 framework-dependent + apphost; classic net48 AnyCPU exe)
        run: |
          dotnet publish emu/tests/dotnet/app -c Release -o /tmp/dn/app
          dotnet build emu/tests/dotnet/fx -c Release -o /tmp/dn/fx
          mkdir -p dn-tests && cp -r /tmp/dn/app /tmp/dn/fx dn-tests/
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-pack
          path: public/x64/dotnet/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-tests
          path: dn-tests/
          if-no-files-found: error

  emulator:
    name: Nebula x64 emulator · native tests + wasm64 build
    runs-on: ubuntu-latest
    needs: [runtime-pack, dotnet-pack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-tests, path: /tmp/dn }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - name: Build cmd.exe from source (emu/cmd, zig cc -target x86_64-windows-gnu) + native runner + wasm64 module (zig cc -target wasm64-freestanding)
        run: BUILD_CMD=1 BUILD_PWSH=1 ZIG=zig ./emu/x64/build.sh
      - name: cmd.exe built from source matches the committed emu/cmd/cmd.exe and public/x64/apps/cmd.exe
        run: |
          cmp emu/cmd/cmd.exe public/x64/apps/cmd.exe
          if ! git diff --quiet -- emu/cmd/cmd.exe; then echo "::warning::cmd.exe built in CI differs from the committed one (zig drift?) — CI build is tested"; cp emu/cmd/cmd.exe public/x64/apps/cmd.exe; fi
      - name: Native capability tests (hello, bench, busybox-w32 incl. virtual disk + stdin, plink, NebulaStrike, cmd.exe/system()/subprocess, real msvcp140 via runtime pack, rejections)
        run: ./emu/tests/run.sh
      - name: .NET tests (REAL CoreCLR 10 + RyuJIT on the emulator — LINQ/exceptions/JSON/reflection/Regex/GC, apphost, GC with spinning + pool threads, HttpClient, direct .dll start, net48 exe, rejection without the pack)
        run: |
          mkdir -p /tmp/dn/pack && (cd public/x64/dotnet && find . -name '*.gz' -print0 | while IFS= read -r -d '' f; do mkdir -p "/tmp/dn/pack/$(dirname "$f")"; gunzip -c "$f" > "/tmp/dn/pack/${f%.gz}"; done)
          ls -la /tmp/dn/pack /tmp/dn/app | head -20
          ./emu/tests/dotnet.sh /tmp/dn/pack /tmp/dn/app /tmp/dn/fx
      - name: wasm64 module is bit-identical to the committed public/x64/nebula_x64.wasm
        run: |
          git status --porcelain public/x64/nebula_x64.wasm
          if ! git diff --quiet -- public/x64/nebula_x64.wasm; then echo "::warning::committed wasm differs from CI build (zig version drift?) — CI build is used"; fi
          ls -la public/x64/nebula_x64.wasm
      - name: PE compatibility scan of the bundled samples (report)
        run: |
          for f in public/downloads/NebulaStrike.exe public/x64/samples/*.exe public/x64/apps/*.exe; do echo "== $f"; ./emu/x64/x64run --inspect "$f" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['verdict'], '|', d['why']); print('imports', d['imports'], 'known', d['knownImports'], 'missing', d['unknownImportsCount'])"; done
      - uses: actions/upload-artifact@v4
        with:
          name: nebula_x64-wasm64
          path: public/x64/nebula_x64.wasm

  test:
    needs: emulator
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Install real opencode (free model opencode/big-pickle, no API key)
        run: bun install -g opencode-ai
      - name: opencode --version
        run: opencode --version

      - name: Bridge integration test (bun test → real agent answer over SSE)
        run: bun test opencode/bridge.test.ts
        timeout-minutes: 8
      - name: Native agent loop (in-app opencode protocol → real Zen model, real shell + files)
        run: bun test opencode/native-agent.test.ts
        timeout-minutes: 5

      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop e2e (33 scenarios incl. .NET 10 (real CoreCLR on the emulator), x64 emulator hello/NebulaStrike/busybox/plink/runtime pack (real msvcp140)/real apps SQLite-jq-Lua-7-Zip-zstd-ripgrep-fd/CPython 3.12/virtual disk + stdin/processes + pipes/SEH + C++ + hardware exceptions, LIVE + NATIVE opencode, WebGL)
        run: node e2e/with-bridge.mjs
        timeout-minutes: 25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e/shots/
          if-no-files-found: ignore

  android:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with accepted licences; Gradle downloads platform 36 itself
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version from tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          IFS=. read -r a b c <<< "$V"; CODE=$(( ${a:-0}*10000 + ${b:-0}*100 + ${c%%-*} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/NebulaOS-v${{ steps.v.outputs.name }}-android.apk
          ls -la ../release
      - name: Verify APK signature & manifest
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs release/*.apk | head -5
          $BT/aapt dump badging release/*.apk | grep -E "package:|application-label:|sdkVersion|uses-permission" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: NebulaOS-android-apk
          path: release/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk

  binaries:
    name: bridge binaries (all platforms)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime-pack, path: public/x64/sys32 }
      - uses: actions/download-artifact@v4
        with: { name: dotnet-pack, path: public/x64/dotnet }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: bun run opencode/compile-all.ts
      - name: Pack dist + binaries
        run: |
          cd release
          for f in opencode-bridge-*; do
            case "$f" in *.exe) zip -qr "${f%.exe}.zip" "$f" ../dist ;; *) tar -czf "$f.tar.gz" "$f" -C .. dist ;; esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-bridge-binaries
          path: |
            release/*.zip
            release/*.tar.gz
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
