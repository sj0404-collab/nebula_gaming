name: Game video (real game in the x64 emulator, with sound)

# Records a short clip WITH SOUND of a real game running on the browser build of the emulator (JIT on), entirely on the
# runner: Shattered Pixel Dungeon v4.0.2 — the official open-source (GPL) Windows build from the author's GitHub releases
# (Java 17 + LWJGL 3 + libGDX, OpenGL through the WebGL2 bridge, music through the audio bridge).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'clip length in seconds'
        default: '15'
      settle_frames:
        description: 'frames the game must have presented before recording starts (title screen)'
        default: '400'
      jit:
        description: 'x86→wasm JIT (1 = on, 0 = interpreter only)'
        default: '1'
      gltrace:
        description: 'GL call trace "<afterFrame>:<calls>" written into the report (diagnostics), empty = off'
        default: ''
      jitskip:
        description: 'JIT bisection "lo:hi": instruction kinds in that range are interpreted (diagnostics), empty = off'
        default: ''
      actions:
        description: 'scripted input before recording, e.g. "click:0.5,0.83@80;key:Enter@40" (fractions of the game screen, @frames to wait)'
        default: ''
      gpu:
        description: 'browser GPU backend: mesa-gl (Mesa llvmpipe, ~3x SwiftShader) | swiftshader | mesa-vk'
        default: 'mesa-gl'
      record_clicks:
        description: clicks during the recording, "fx,fy;fx,fy" (one every ~3 s)
        default: ''
      chrome_args:
        description: 'extra Chromium flags, e.g. "--js-flags=--no-liftoff" (V8 tiering experiments)'
        default: ''

run-name: "game video · jit=${{ inputs.jit }} skip=${{ inputs.jitskip }} trace=${{ inputs.gltrace }} ${{ inputs.seconds }}s"
permissions:
  contents: read

jobs:
  record:
    name: Shattered Pixel Dungeon · title screen + music → mp4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: mlugg/setup-zig@v2
      - name: Build the wasm64 module from the current source (the committed public/x64/nebula_x64.wasm may lag behind emu/x64)
        run: WASM_NAMES=1 ZIG=zig ./emu/x64/build.sh   # keep function names: the browser profile (--profile) is readable
      - run: npm ci
      - run: WASM_NAMES=1 npm run build
      - name: Playwright chromium + ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y -q ffmpeg >/dev/null 2>&1 || true
          if [ "${{ github.event.inputs.gpu || 'mesa-gl' }}" != "swiftshader" ]; then sudo apt-get install -y -q mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgles2 mesa-utils vulkan-tools xvfb >/dev/null 2>&1; ls /usr/share/vulkan/icd.d/ || true; fi
          ffmpeg -version | head -1
      - name: Download the official Shattered Pixel Dungeon v4.0.2 Windows build (GPL, author's GitHub release)
        run: |
          curl -sSL -o /tmp/ShatteredPD-v4.0.2-Windows.zip https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v4.0.2/ShatteredPD-v4.0.2-Windows.zip
          ls -la /tmp/ShatteredPD-v4.0.2-Windows.zip; unzip -l /tmp/ShatteredPD-v4.0.2-Windows.zip | head -15
      - name: Run the game in the emulator and record frames + audio
        env:
          GPU: ${{ github.event.inputs.gpu || 'mesa-gl' }}
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '4'
        run: |
          RUN="node"; if [ "$GPU" != "swiftshader" ]; then RUN="xvfb-run -a node"; fi
          $RUN e2e/record.mjs /tmp/ShatteredPD-v4.0.2-Windows.zip --seconds "${{ github.event.inputs.seconds || '15' }}" --settle-frames "${{ github.event.inputs.settle_frames || '400' }}" --jit "${{ github.event.inputs.jit || '1' }}" --gltrace "${{ github.event.inputs.gltrace }}" --jitskip "${{ github.event.inputs.jitskip }}" --actions "${{ github.event.inputs.actions }}" --record-clicks "${{ github.event.inputs.record_clicks }}" --chrome-args "${{ github.event.inputs.chrome_args }}" --profile --out e2e/video
        timeout-minutes: 60
      - name: Mux with ffmpeg (exact per-frame durations + captured PCM)
        run: |
          cd e2e/video
          if grep -q '^file' concat.txt; then ffmpeg -loglevel error -y -f concat -safe 0 -i concat.txt -i audio.wav -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,fps=25" -c:a aac -b:a 160k -shortest game.mp4; fi
          # the in-page MediaRecorder capture of the screen canvas (every composited frame, not just the ~2-8 screenshots/s)
          if [ -s screen.webm ]; then ffmpeg -loglevel error -y -i screen.webm -i audio.wav -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,fps=30" -c:a aac -b:a 160k -shortest game-smooth.mp4 && ffprobe -v error -show_entries stream=codec_type,codec_name,duration,nb_frames -of compact game-smooth.mp4; fi
          for f in game.mp4 game-smooth.mp4; do [ -s $f ] && ffprobe -v error -show_entries stream=codec_type,codec_name,duration -of compact $f; done; true
          if [ -s browser.cpuprofile ]; then echo "== browser main-thread profile over the recording"; node ../../emu/tools/profsum.mjs browser.cpuprofile 40; fi
          ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-video
          path: |
            e2e/video/game.mp4
            e2e/video/game-smooth.mp4
            e2e/video/browser.cpuprofile
            e2e/video/screen.webm
            e2e/video/step-*.png
            e2e/video/title.png
            e2e/video/title-screen.png
            e2e/video/audio.wav
            e2e/video/console.txt
            e2e/video/report.txt
            e2e/video/gltrace.txt
            e2e/video/step-*.png
            e2e/video/report-stopped.txt
          if-no-files-found: warn
