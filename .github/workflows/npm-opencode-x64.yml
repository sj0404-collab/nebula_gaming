name: npm install opencode-ai inside the x64 emulator (long run)

# The whole npm route, unmodified, on the emulated Windows: node.exe v24 (official win-x64 zip) runs npm, which talks to
# registry.npmjs.org over the emulated Winsock, downloads the opencode-ai package + its platform binary, extracts them to
# the virtual disk (a --mount-rw folder on the runner), runs the postinstall script (which probes the CPU through the
# emulator's powershell.exe and verifies the binary with `opencode.exe --version`), then `npx opencode --version`, and
# finally the installed TUI is driven exactly like in opencode-x64.yml (prompt → answer → bash tool → grep tool).
# Needs a 16 GB runner: npm parses ~90 MB of registry metadata for the 13 platform packages inside the guest.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'
  push:
    tags: ['v*']

jobs:
  npm-opencode:
    name: node.exe + npm install opencode-ai → npx opencode → TUI
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Build the native runner
        run: ./emu/x64/nbuild.sh && ./emu/x64/x64run --inspect emu/tests/hello.exe | head -c 300
      - name: Tools (pyte + pillow for terminal rendering, DejaVu font)
        run: |
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null || true
          python3 -m pip install -q pyte pillow
      - name: Node.js 24 for Windows x64 (official zip, unmodified)
        run: |
          mkdir -p /tmp/x && cd /tmp/x
          curl -sSL -o node.zip https://nodejs.org/dist/v24.11.0/node-v24.11.0-win-x64.zip
          python3 -c "import zipfile; zipfile.ZipFile('node.zip').extractall('.')" && mv node-v24.11.0-win-x64 node && rm node.zip
          mkdir -p home tmp proj out && cp -r "$GITHUB_WORKSPACE/emu/tools/opencode-home/." home/ && cp -r "$GITHUB_WORKSPACE/emu/tools/opencode-project/." proj/
          ls -la node/node.exe
      - name: node.exe --version / npm --version through the emulator
        run: |
          ./emu/x64/x64run --quiet --no-stdin --max-ms 600000 --mount /tmp/x/node=C:\node /tmp/x/node/node.exe --version
          ./emu/x64/x64run --quiet --no-stdin --max-ms 600000 --mount /tmp/x/node=C:\node /tmp/x/node/node.exe C:\node\node_modules\npm\bin\npm-cli.js --version
      - name: npm install opencode-ai@1.19.5 (registry metadata + tarballs over the emulated network, postinstall inside the guest)
        id: npm_install
        continue-on-error: true
        env:
          X64_GUEST_ENV: HOME=C:\Users\user;NPM_CONFIG_UPDATE_NOTIFIER=false;NPM_CONFIG_FUND=false;NPM_CONFIG_AUDIT=false;NPM_CONFIG_PROGRESS=false;NO_COLOR=1
        run: |
          set +e
          start=$(date +%s)
          ./emu/x64/x64run --quiet --no-stdin --max-ms 7200000 --mount /tmp/x/node=C:\node --mount-rw '/tmp/x/home=C:\Users\user' --mount-rw '/tmp/x/tmp=C:\tmp' --mount-rw '/tmp/x/proj=C:\nebula' \
            /tmp/x/node/node.exe C:\node\node_modules\npm\bin\npm-cli.js install opencode-ai@1.19.5 --loglevel=notice --foreground-scripts 2>&1 | tee /tmp/x/out/npm-install.txt | tr -d '\r' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[\\|/-]*$' | tail -c 20000
          rc=${PIPESTATUS[0]}
          echo "npm install exit code: $rc  (took $(( $(date +%s) - start )) s)"
          ls -la /tmp/x/proj/node_modules /tmp/x/proj/node_modules/opencode-ai/bin 2>/dev/null || true
          du -sh /tmp/x/home/npm-cache 2>/dev/null || true
          [ "$rc" -eq 0 ] && [ -s /tmp/x/proj/node_modules/opencode-ai/bin/opencode.exe ] && [ "$(stat -c %s /tmp/x/proj/node_modules/opencode-ai/bin/opencode.exe)" -gt 100000000 ]
      - name: Fallback — the same two packages by tarball URL (skips the 90 MB of registry metadata; only if the full install failed)
        if: steps.npm_install.outcome == 'failure'
        env:
          X64_GUEST_ENV: HOME=C:\Users\user;NPM_CONFIG_UPDATE_NOTIFIER=false;NPM_CONFIG_FUND=false;NPM_CONFIG_AUDIT=false;NPM_CONFIG_PROGRESS=false;NO_COLOR=1
        run: |
          echo "::warning::full 'npm install opencode-ai' did not finish — see npm-install.txt; installing by tarball URL instead"
          rm -rf /tmp/x/proj/node_modules /tmp/x/proj/package*.json
          ./emu/x64/x64run --quiet --no-stdin --max-ms 7200000 --mount /tmp/x/node=C:\node --mount-rw '/tmp/x/home=C:\Users\user' --mount-rw '/tmp/x/tmp=C:\tmp' --mount-rw '/tmp/x/proj=C:\nebula' \
            /tmp/x/node/node.exe C:\node\node_modules\npm\bin\npm-cli.js install --omit=optional --loglevel=notice --foreground-scripts https://registry.npmjs.org/opencode-ai/-/opencode-ai-1.19.5.tgz https://registry.npmjs.org/opencode-windows-x64-baseline/-/opencode-windows-x64-baseline-1.19.5.tgz 2>&1 | tee /tmp/x/out/npm-install-fallback.txt | tr -d '\r' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[\\|/-]*$' | tail -c 8000
          [ "$(stat -c %s /tmp/x/proj/node_modules/opencode-ai/bin/opencode.exe)" -gt 100000000 ]
      - name: npx opencode --version (node.exe → npx → cmd.exe → node_modules\.bin\opencode.cmd → opencode.exe)
        env:
          X64_GUEST_ENV: HOME=C:\Users\user;NPM_CONFIG_UPDATE_NOTIFIER=false
          X64_LOG: '1'
        run: |
          ./emu/x64/x64run --quiet --no-stdin --max-ms 1200000 --mount /tmp/x/node=C:\node --mount-rw '/tmp/x/home=C:\Users\user' --mount-rw '/tmp/x/proj=C:\nebula' \
            /tmp/x/node/node.exe C:\node\node_modules\npm\bin\npx-cli.js opencode --version 2>/tmp/x/out/npx.err | tr -d '\r' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee /tmp/x/out/npx-version.txt
          grep -a "CreateProcess" /tmp/x/out/npx.err | cut -c1-200
          grep -q "1.19.5" /tmp/x/out/npx-version.txt
      - name: Run the npm-installed TUI and drive it (prompt → answer → bash tool → grep tool)
        env:
          X64_GUEST_ENV: OPENCODE_DISABLE_MODELS_FETCH=1;OPENCODE_DISABLE_AUTOUPDATE=1;OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER=1;OPENCODE_DISABLE_FFF=1;HOME=C:\Users\user
          X64_LOG: '1'
          TUI_RESPOND_LOG: /tmp/respond.log
        run: |
          printf 'node_modules\n' > /tmp/x/proj/.ignore; printf 'node_modules\n' > /tmp/x/proj/.gitignore   # keep ripgrep out of the 211 MB binary
          mkfifo /tmp/in.fifo
          : > /tmp/tui.txt
          (./emu/x64/x64run --max-ms 6000000 --mount /tmp/x/node=C:\node --mount-rw '/tmp/x/proj=C:\nebula' --mount-rw '/tmp/x/home=C:\Users\user' /tmp/x/proj/node_modules/opencode-ai/bin/opencode.exe > /tmp/tui.txt 2>/tmp/tui.err 3>&2 < /tmp/in.fifo &)
          (python3 emu/tools/tui_respond.py /tmp/tui.txt /tmp/in.fifo >/dev/null 2>/tmp/respond.err &)
          set +e
          python3 emu/tools/tui_drive.py /tmp/tui.txt /tmp/in.fifo /tmp/x/out; rc=$?
          set -e
          pkill -f x64run || true
          echo "drive exit code: $rc"
          echo "### npm install opencode-ai → npx opencode → TUI, all inside the x64 emulator" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -c 1500 /tmp/x/out/npm-install.txt | tr -d '\r' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[\\|/-]*$' >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/x/out/npx-version.txt >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in 3-answer 4-bash-tool 5-grep-tool; do echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -c 2500 /tmp/x/out/$f.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"; done
          grep -a "RESULT" -r /tmp/x/out || true
          echo "--- ~/.cache/opencode/bin:"; ls -la /tmp/x/home/.cache/opencode/bin || true
          mkdir -p /tmp/x/out/oclog; cp -r /tmp/x/home/.local/share/opencode/log/. /tmp/x/out/oclog/ 2>/dev/null || true
          [ "$rc" -ne 3 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-opencode-x64
          path: |
            /tmp/x/out/
            /tmp/tui.err
            /tmp/respond.log
