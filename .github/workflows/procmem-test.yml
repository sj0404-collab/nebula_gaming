name: Process memory and locale regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'emu/x64/**'
      - 'emu/tests/procmem.c'
      - 'emu/tests/layered.c'
      - '.github/workflows/procmem-test.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  guest-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - name: Check x86 stdcall lookup ordering
        run: |
          python3 - <<'PYCODE'
          import re
          text = open('emu/x64/stdcall32.inc').read()
          names = re.findall(r'\{ "([^" ]+)",\s*\d+ \}', text)
          assert names == sorted(names), 'stdcall table must remain in binary-search order'
          PYCODE
      - name: Build native emulator and 32/64-bit guest regressions
        run: |
          cd emu/x64
          cc -O2 -Wall -Wno-unused-function -Wno-unused-parameter -Wno-misleading-indentation -o x64run lib.c cpu.c pe.c win32.c gdi.c vfs.c api.c dxbc.c host_native.c main_native.c -lm
          cd ../..
          zig cc -target x86_64-windows-gnu -O2 emu/tests/procmem.c -o emu/tests/procmem.exe
          zig cc -target x86-windows-gnu -O2 emu/tests/procmem.c -o emu/tests/procmem32.exe
          zig cc -target x86_64-windows-gnu -O2 emu/tests/layered.c -o emu/tests/layered.exe -lgdi32 -luser32
          zig cc -target x86-windows-gnu -O2 emu/tests/layered.c -o emu/tests/layered32.exe -lgdi32 -luser32
      - name: Execute guest regressions
        run: |
          set -o pipefail
          for exe in procmem.exe procmem32.exe; do
            echo "--- $exe ---"
            emu/x64/x64run --no-stdin --list-vfs --max-ms 30000 "emu/tests/$exe" 2>&1 | tee "$RUNNER_TEMP/$exe.log"
            grep -q 'procmem: PASS' "$RUNNER_TEMP/$exe.log"
            grep -q '\[vfs\] file .*procmem' "$RUNNER_TEMP/$exe.log"
            if grep -q 'stdcall cleanup size unknown' "$RUNNER_TEMP/$exe.log"; then exit 1; fi
          done
      - name: Verify layered-window pixels (x86 and x64)
        run: |
          set -o pipefail
          for exe in layered.exe layered32.exe; do
            mkdir -p "$RUNNER_TEMP/$exe"; cd "$RUNNER_TEMP/$exe"
            "$GITHUB_WORKSPACE/emu/x64/x64run" --no-stdin --desktop 400x300 --frames 1 --max-ms 10000 "$GITHUB_WORKSPACE/emu/tests/$exe" 2>&1 | tee run.log
            grep -q 'layered: PASS' run.log
            python3 - <<'PY'
          import glob
          files = glob.glob('frame_*.ppm')
          assert files, 'no frames produced'
          found = False
          for path in sorted(files)[-1:]:
              with open(path, 'rb') as f:
                  assert f.readline().strip() == b'P6'
                  w, h = map(int, f.readline().split()); assert f.readline().strip() == b'255'
                  p = f.read()
              def pixel(x,y): return tuple(p[(y*w+x)*3:(y*w+x)*3+3])
              if pixel(30,40) == (255,0,0) and pixel(70,40) == (0,255,0): found = True
          assert found, 'layered window source pixels were not presented'
          PY
          done
