name: sitecheck (open a real exe/zip through the Programs UI in the browser)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'download URL of the .exe / .zip'
        default: 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe'
      filename:
        description: 'file name to open it under (spaces / Cyrillic allowed) — empty = name from the URL'
        default: ''
      args:
        description: 'command line for a second run (empty = none)'
        default: ''
      wait:
        description: 'ms to let it run'
        default: '40000'
      keys:
        description: 'keys to press in the guest screen, "Enter@25000;Enter@35000" (ms after first frame)'
        default: ''
      jit:
        description: 'JIT on (1) / off (0)'
        default: '1'
      apitrace:
        description: 'native pass with --apitrace (every Win32 call into native.txt)'
        default: '0'
      jitskip:
        description: 'JIT bisect: instruction kinds lo:hi are interpreted instead of translated (e.g. 1:27); empty = none'
        default: ''
run-name: "sitecheck · ${{ inputs.filename || inputs.url }} · jit=${{ inputs.jit }} ${{ inputs.jitskip && format('skip={0}', inputs.jitskip) || '' }}"
permissions:
  contents: read
jobs:
  check:
    name: open in the browser (Playwright) and keep screenshots + report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: mlugg/setup-zig@v2
      - name: Build the wasm64 module from the current source
        run: ZIG=zig ./emu/x64/build.sh
      - run: npm ci
      - run: npm run build
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Download the file
        run: |
          mkdir -p /tmp/sc; cd /tmp/sc
          NAME="${{ github.event.inputs.filename }}"; [ -n "$NAME" ] || NAME=$(basename "${{ github.event.inputs.url }}")
          curl -sSL --retry 3 -o "$NAME" "${{ github.event.inputs.url }}"; ls -la /tmp/sc; echo "NAME=$NAME" >> $GITHUB_ENV
      - name: Native run first (x64run, 25 s budget, X64_LOG=1) — the fault address / API trace without the browser
        run: |
          cd emu/x64 && cc -O2 -Wall -Wno-unused-function -Wno-unused-parameter -Wno-misleading-indentation -o x64run lib.c cpu.c pe.c win32.c gdi.c vfs.c api.c dxbc.c host_native.c main_native.c -lm && cd ../..
          cp "/tmp/sc/$NAME" /tmp/sc/native_copy.exe
          mkdir -p /tmp/sc/guest_tmp
          AT=""; [ "${{ inputs.apitrace }}" = "1" ] && AT="--apitrace"
          # the same keys as in the browser pass, as x64run --key VK@ms (Enter/Escape/Tab/Space/Down/Up/letters); mouse clicks are browser-only
          KEYS=""; IFS=';' read -ra KV <<< "${{ github.event.inputs.keys }}"; for kv in "${KV[@]}"; do k="${kv%%@*}"; at="${kv#*@}"; [ -n "$k" ] || continue; case "$k" in Enter) vk=0x0d;; Escape) vk=0x1b;; Tab) vk=0x09;; Space) vk=0x20;; ArrowDown) vk=0x28;; ArrowUp) vk=0x26;; click:*) continue;; *) vk=$(printf '0x%02x' "'${k:0:1}");; esac; KEYS="$KEYS --key $vk@$at"; done
          MS="${{ github.event.inputs.wait }}"; [ "$MS" -gt 25000 ] 2>/dev/null || MS=25000; echo "native: --max-ms $MS $KEYS"
          rc=0; X64_LOG=1 timeout $((MS / 1000 + 90)) ./emu/x64/x64run --quiet --no-stdin $AT --max-ms $MS $KEYS --stats --mount-rw "/tmp/sc/guest_tmp=C:\\tmp" "/tmp/sc/$NAME" > /tmp/sc/native.txt 2>&1 || rc=$?
          echo "native rc=$rc"; grep -a -v "^\[wnd\]" /tmp/sc/native.txt | tail -60 | cut -c1-300
          find /tmp/sc/guest_tmp -type f | head -20; find /tmp/sc/guest_tmp -maxdepth 1 -name "Setup Log*" -exec sh -c 'echo "--- $1"; sed "1s/^\xEF\xBB\xBF//" "$1" | grep -v "DLL function import\|Function name:\|DLL name:\|Dest DLL name:\|Importing the DLL\|imported the DLL\|Failed to import" | head -60 | cut -c1-240; echo "--- tail"; tail -40 "$1" | cut -c1-240' _ {} \; ; find /tmp/sc/guest_tmp -type f \( -name "*.tmp" -o -name "*.exe" -o -name "*.dll" \) -size +20k -exec cp {} /tmp/sc/ \; 2>/dev/null || true; find /tmp/sc/guest_tmp -maxdepth 1 -name "Setup Log*" -exec cp {} /tmp/sc/ \; 2>/dev/null || true
      - name: Open it through the Programs UI
        env:
          X64_JIT: ${{ github.event.inputs.jit }}
          X64_JITSKIP: ${{ github.event.inputs.jitskip }}
        run: node e2e/sitecheck.mjs "/tmp/sc/$NAME" --wait "${{ github.event.inputs.wait }}" --args "${{ github.event.inputs.args }}" --keys "${{ github.event.inputs.keys }}" 2>&1 | tee /tmp/sc/sitecheck.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitecheck
          path: |
            e2e/shots/site-*.png
            /tmp/sc/sitecheck.txt
            /tmp/sc/native.txt
            /tmp/sc/browser_log.txt
            /tmp/sc/*.tmp
            /tmp/sc/*.dll
            /tmp/sc/Setup Log*.txt
          if-no-files-found: warn
